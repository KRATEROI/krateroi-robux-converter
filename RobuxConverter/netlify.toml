[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://pagead2.googlesyndication.com; connect-src 'self' https://open.er-api.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-src https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
